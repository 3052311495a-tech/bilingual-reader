<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>我的双语阅读</title>
<style>
  :root{ --line:#e6e8ec; --muted:#6b7280; --primary:#2563eb; --bg:#fff; --fg:#111827; --soft:#f6f7f9; }
  @media (prefers-color-scheme: dark){ :root{ --line:#334155; --muted:#94a3b8; --bg:#1e293b; --fg:#e5e7eb; --soft:#26334a; } }
  *{box-sizing:border-box}
  body{
    width:308px;margin:0;padding:14px 14px 12px;background:var(--bg);color:var(--fg);
    font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
  }
  .hd{display:flex;align-items:center;gap:9px;margin-bottom:12px}
  .logo{
    width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(145deg,#3b82f6,#1d4ed8);color:#fff;font-weight:700;font-size:13px;
    box-shadow:0 3px 8px rgba(37,99,235,.35)
  }
  .title{font-size:13.5px;font-weight:650;letter-spacing:-.01em;line-height:1.2}
  .sub{color:var(--muted);font-size:10.5px;margin-top:1px}
  .stat{
    display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line);
    border-radius:10px;padding:8px 11px;margin-bottom:8px;font-size:12px
  }
  .stat b{font-weight:650}
  .stat .dot{width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.15)}
  .stat .dot.off{background:#94a3b8;box-shadow:0 0 0 3px rgba(148,163,184,.15)}
  .stat .grow{flex:1}
  .warn{display:none;align-items:center;gap:8px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;
        border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:11.5px;line-height:1.5}
  @media (prefers-color-scheme: dark){ .warn{background:#3a2412;border-color:#7c4a1e;color:#fdba74} }
  .warn .grow{flex:1}
  .btns{display:grid;gap:7px}
  button{
    font:inherit;font-size:12.5px;cursor:pointer;padding:9px 10px;border-radius:10px;
    border:1px solid var(--line);background:var(--bg);color:inherit;text-align:center;transition:.12s
  }
  button:hover{border-color:#c7cdd6}
  @media (prefers-color-scheme: dark){ button{background:#334155;border-color:#475569} button:hover{background:#3d4c63} }
  button.primary{background:linear-gradient(145deg,#3b82f6,#2563eb);border-color:transparent;color:#fff;font-weight:600}
  button.primary:hover{filter:brightness(1.06)}
  button.on{background:linear-gradient(145deg,#10b981,#059669);border-color:transparent;color:#fff;font-weight:600}
  button:disabled{opacity:.5;cursor:not-allowed}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .links{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
  .links button{background:transparent;padding:7px 4px;font-size:12px;color:var(--muted)}
  .links button:hover{color:var(--fg)}
  .hint{color:var(--muted);font-size:10.5px;margin-top:10px;line-height:1.65;border-top:1px solid var(--line);padding-top:9px}
  kbd{font:10px/1 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 4px}
  .note{color:#0f766e;font-size:10.5px;margin-top:6px;display:none}
  .diag{margin-top:9px;border:1px dashed var(--line);border-radius:9px;padding:7px 9px;font:10.5px/1.7 ui-monospace,Menlo,monospace;color:var(--muted)}
  .diag-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;
           font:inherit;color:var(--muted);letter-spacing:.04em}
  .diag-hd button{background:transparent;border:0;padding:0 2px;font:inherit;color:var(--primary);cursor:pointer;width:auto}
  .diag b{color:var(--fg);font-weight:600}
  .diag .bad{color:#dc2626}
  .diag .good{color:#059669}
</style>
</head>
<body>
  <div class="hd">
    <div class="logo">译</div>
    <div>
      <div class="title">我的双语阅读</div>
      <div class="sub">DeepSeek V4.1 · <span id="ver">v?</span></div>
    </div>
  </div>

  <div class="stat">
    <span class="dot off" id="dot"></span>
    <span>本页译文 <b id="count">0</b></span>
    <span class="grow"></span>
    <span>生词 <b id="words">0</b></span>
  </div>

  <div class="warn" id="keyRow">
    <span class="grow" id="keyMsg">还没填 API Key</span>
    <button id="goSettings" style="padding:3px 9px;font-size:11.5px">去填</button>
  </div>

  <div class="btns">
    <button id="toggle" class="primary">翻译此页</button>
    <div class="two">
      <button id="modeBi">双语对照</button>
      <button id="modeTarget">纯译文</button>
    </div>
    <button id="outline">智能大纲</button>
  </div>

  <div class="note" id="note"></div>

  <div class="diag" id="diag">
    <div class="diag-hd"><span>诊断</span><button id="diagBtn">刷新</button></div>
    <div id="diagBody">—</div>
  </div>

  <div class="links">
    <button id="openOptions">设置</button>
    <button id="openWords">生词本 / 收藏</button>
  </div>

  <div class="hint">
    页面右侧有个小球，点它也能开翻译，可以上下拖<br>
    <kbd>⌥</kbd> + 鼠标悬停查词 · 划词出释义<br>
    <kbd>⌥</kbd><kbd>T</kbd> 翻译 · <kbd>⌥</kbd><kbd>Y</kbd> 切模式 · <kbd>⌥</kbd><kbd>O</kbd> 大纲
  </div>

<script src="popup.js"></script>
</body>
</html>
